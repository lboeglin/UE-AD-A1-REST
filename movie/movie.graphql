type Query {
    "All movies."
    all_movies: [Movie]!
    "A movie by its ID."
    movie_with_id(_id: ID!): Movie
    "Movies matching the given IDs, in the same order; null for an unknown ID."
    movies_with_ids(_ids: [ID!]!): [Movie]!
    "All movies with the exact given title."
    movie_with_title(_title: String!): [Movie]!

    "All actors."
    all_actors: [Actor]!
    "An actor by their ID."
    actor_with_id(_id: ID!): Actor
    "All actors who played in the given movie."
    actors_by_movie(_movieid: ID!): [Actor]!
}

type Mutation {
    "Adds a new movie with a server-generated UUID. Admin only."
    add_movie(_movieinput: MovieCreateInput!): Movie
    "Updates the provided fields of a movie (partial update). Admin only."
    update_movie(_id: ID!, _movieinput: MovieUpdateInput!): Movie
    "Deletes a movie, removes it from every actor's filmography and from the schedule (calls Schedule). Admin only."
    del_movie(_id: ID!): Movie

    "Adds a new actor with a server-generated UUID. Admin only."
    add_actor(_actorinput: ActorCreateInput!): Actor
    "Updates the provided fields of an actor (partial update). Admin only."
    update_actor(_id: ID!, _actorinput: ActorUpdateInput!): Actor
    "Deletes an actor. Admin only."
    del_actor(_id: ID!): Actor
}

"A movie."
type Movie {
    id: ID!
    title: String!
    director: String!
    rating: Float!
    "Actors who played in this movie."
    actors: [Actor]
    "Screening dates of this movie in YYYYMMDD format (calls Schedule)."
    times: [String]
}

"An actor."
type Actor {
    id: ID!
    firstname: String!
    lastname: String!
    birthyear: Int!
    "Movies this actor played in, in the same order as their stored IDs; null for a movie that no longer exists."
    films: [Movie]!
}

"Fields to create a movie (the ID is generated by the server)."
input MovieCreateInput {
    title: String!
    "Defaults to an empty string."
    director: String
    "Defaults to 0."
    rating: Float
}

"Fields to update on a movie; all are optional."
input MovieUpdateInput {
    title: String
    director: String
    rating: Float
}

"Fields to create an actor (the ID is generated by the server)."
input ActorCreateInput {
    firstname: String!
    lastname: String!
    "Defaults to 0."
    birthyear: Int
    "IDs of existing movies the actor played in; defaults to an empty list."
    films: [ID]
}

"Fields to update on an actor; all are optional."
input ActorUpdateInput {
    firstname: String
    lastname: String
    birthyear: Int
    "Replaces the list of movie IDs; every ID must match an existing movie."
    films: [ID]
}