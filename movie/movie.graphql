type Query {
    all_movies: [Movie]!
    movie_with_id(_id: ID!): Movie
    movies_with_ids(_ids: [ID!]!): [Movie]!
    movie_with_title(_title: String!): [Movie]!

    all_actors: [Actor]!
    actor_with_id(_id: ID!): Actor
    actors_by_movie(_movieid: ID!): [Actor]!
}

type Mutation {
    add_movie(_movieinput: MovieCreateInput!): Movie
    update_movie(_id: ID!, _movieinput: MovieUpdateInput!): Movie
    del_movie(_id: ID!): Movie

    add_actor(_actorinput: ActorCreateInput!): Actor
    update_actor(_id: ID!, _actorinput: ActorUpdateInput!): Actor
    del_actor(_id: ID!): Actor
}


type Movie {
    id: ID!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
    times: [String]
}

type Actor {
    id: ID!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [Movie]!
}


input MovieCreateInput {
    title: String!
    director: String
    rating: Float
}

input MovieUpdateInput {
    title: String
    director: String
    rating: Float
}

input ActorCreateInput {
    firstname: String!
    lastname: String!
    birthyear: Int
    films: [ID]
}

input ActorUpdateInput {
    firstname: String
    lastname: String
    birthyear: Int
    films: [ID]
}