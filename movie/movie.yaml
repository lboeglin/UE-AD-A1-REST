openapi: 3.0.3
info:
  title: Movie Service API
  description: |
    API for browsing, adding, updating and deleting movies.
    Read operations are public. Write operations are open (no authentication for now).
  version: "1.0.0"
  contact:
    name: Helene Coullon
    url: https://helene-coullon.fr/
    email: helene.coullon@imt-atlantique.fr
servers:
  - url: http://localhost:3200
    description: Local development server

tags:
- name: admin
  description: Secured Admin-only calls
- name: dev
  description: Operations available to regular developers

paths:
  /:
    get:
      tags:
        - dev
      summary: Service home page
      description: Returns an HTML welcome message.
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the Movie service!</h1>"

  /json:
    get:
      tags:
        - dev
      summary: Retrieve the full list of movies
      description: Returns the list of all available movies.
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"

  /movies/{movieid}:
    get:
      tags:
        - dev
      summary: Retrieve a movie by its ID
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          $ref: "#/components/responses/MovieNotFound"

    post:
      tags:
        - admin
      summary: Add a new movie
      description: Adds a movie with the given ID, if it doesn't already exist. The ID is taken from the path.
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
            example:
              title: "Dune"
              rating: 8.1
              director: "Denis Villeneuve"
      responses:
        "201":
          description: Movie added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                id: "dune-2021"
                title: "Dune"
                rating: 8.1
                director: "Denis Villeneuve"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Movie ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "movie already exists"

    put:
      tags:
        - admin
      summary: Update a movie
      description: Updates the given fields of a movie (partial update).
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieUpdate"
            example:
              rating: 8.5
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/MovieNotFound"

    delete:
      tags:
        - admin
      summary: Delete a movie
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie deleted, returns the deleted movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          $ref: "#/components/responses/MovieNotFound"

  /moviesbytitle:
    get:
      tags:
        - dev
      summary: Retrieve a movie by its title
      parameters:
        - name: title
          in: query
          required: true
          description: Exact title of the movie to search for
          schema:
            type: string
          example: "Creed"
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Missing title query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "missing 'title' query parameter"
        "404":
          $ref: "#/components/responses/MovieNotFound"

  /movies/{movieid}/{rate}:
    put:
      tags:
        - admin
      summary: Update a movie's rating
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - name: rate
          in: path
          required: true
          description: New rating to assign to the movie
          schema:
            type: number
          example: 7.9
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Rate is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "rate must be a number"
        "404":
          $ref: "#/components/responses/MovieNotFound"

components:
  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Unique identifier of the movie
      schema:
        type: string
      example: "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'rating' must be a number"
    MovieNotFound:
      description: Movie not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "movie not found"

  schemas:
    Movie:
      type: object
      description: Representation of a movie.
      properties:
        id:
          type: string
          description: Unique identifier of the movie
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          description: Movie title
          example: "The Good Dinosaur"
        rating:
          type: number
          format: float
          description: Rating assigned to the movie
          example: 7.4
        director:
          type: string
          description: Movie director
          example: "Peter Sohn"
      required:
        - id
        - title

    MovieInput:
      type: object
      description: Data needed to create a movie (the ID comes from the path).
      properties:
        title:
          type: string
          example: "Dune"
        rating:
          type: number
          format: float
          default: 0
          example: 8.1
        director:
          type: string
          default: ""
          example: "Denis Villeneuve"
      required:
        - title

    MovieUpdate:
      type: object
      description: Fields to update; all are optional.
      properties:
        title:
          type: string
        rating:
          type: number
          format: float
        director:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
          example: "movie not found"