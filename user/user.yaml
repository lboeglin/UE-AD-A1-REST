openapi: 3.0.3
info:
  title: User Service API
  description: Read operations are public. Write operations require a JWT (POST /login) with role admin, except updating a user, which the user itself can also do.
  version: "1.0.0"
  contact:
    name: Rafael Baudry
    email: rafael.baudry@imt-atlantique.fr
servers:
  - url: http://localhost:3203

tags:
- name: admin
  description: Secured Admin-only calls
- name: dev
  description: Operations available to regular developers

paths:
  /:
    get:
      tags: [dev]
      summary: Service home page
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string

  /json:
    get:
      tags: [dev]
      summary: Retrieve the full list of users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /login:
    post:
      tags: [dev]
      summary: Get a JWT token (valid 1 hour) for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
              required: [user_id]
      responses:
        "200":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /users:
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Add a new user (ID generated from the name if omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [dev]
      summary: Retrieve a user by its ID
      responses:
        "200":
          $ref: "#/components/responses/User"
        "404":
          $ref: "#/components/responses/UserNotFound"

    put:
      tags: [dev, admin]
      security:
        - bearerAuth: []
      summary: Update a user (partial update)
      description: Requires a JWT of the user itself or of an admin. The role cannot be changed here (see PUT /users/{user_id}/{role}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"

    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Delete a user
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /users/{user_id}/bookings:
    get:
      tags: [dev, admin]
      security:
        - bearerAuth: []
      summary: Retrieve a user with their detailed bookings
      description: User itself or admin. Calls Booking (the token is forwarded).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User with detailed bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithBookings"
              example:
                id: "chris_rivers"
                name: "Chris Rivers"
                last_active: 1360031010
                role: "user"
                bookings:
                  - date: "20151201"
                    movies:
                      - id: "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
                        title: "Creed"
                        rating: 8.8
                        director: "Ryan Coogler"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token belongs to another user and is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "502":
          description: The Booking service returned an unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "booking service error"
        "503":
          description: The Booking service is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "booking service unavailable"

  /users/{user_id}/{role}:
    put:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Update a user's role
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string

  responses:
    User:
      description: The user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: User is not an admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserNotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "chris_rivers"
        name:
          type: string
          example: "Chris Rivers"
        last_active:
          type: integer
          example: 1360031010
        role:
          type: string
          example: "user"
      required: [id, name]

    UserWithBookings:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            bookings:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    example: "20151201"
                  movies:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                          nullable: true
                        rating:
                          type: number
                        director:
                          type: string

    UserInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        last_active:
          type: integer
          default: 0
        role:
          type: string
          default: "user"
      required: [name]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        last_active:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
