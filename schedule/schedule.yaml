openapi: 3.0.3
info:
  title: Schedule Service API
  description: |
    API for browsing, adding, updating and deleting schedules.
    Read operations are public. Write operations require an admin JWT (Bearer token).
  version: "1.0.0"
  contact:
    name: Rafael Baudry
    email: rafael.baudry@imt-atlantique.fr
servers:
  - url: http://localhost:3202
    description: Local development server

tags:
  - name: admin
    description: Secured Admin-only calls
  - name: dev
    description: Operations available to regular developers

paths:
  /:
    get:
      tags:
        - dev
      summary: Service home page
      description: Returns an HTML welcome message.
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the schedule service!</h1>"

  /json:
    get:
      tags:
        - dev
      summary: Retrieve the full list of schedules
      description: Returns the list of all available schedules.
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"

  /movies/{movieid}/times:
    get:
      tags:
        - dev
      summary: Retrieve the screening dates of a movie
      description: Returns the dates on which the movie is scheduled (empty list if none). Used by Movie for the `times` field.
      parameters:
        - name: movieid
          in: path
          required: true
          description: Id of the movie
          schema:
            type: string
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
      responses:
        "200":
          description: Screening dates of the movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDates"
              example:
                movieid: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                dates: ["20151130", "20151201"]

  /times:
    post:
      tags:
        - admin
      summary: Add a new schedule
      description: Adds a schedule for a specific date with a list of movie IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
            example:
              date: "20151206"
              movies:
                - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Schedule added successfully, returns the created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                date: "20151206"
                movies:
                  - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                  - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/ScheduleConflict"

  /times/{date}:
    get:
      tags:
        - dev
      summary: Retrieve a schedule by date
      description: Returns the schedule and list of movie IDs for a given date.
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                date: "20151130"
                movies:
                  - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                  - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                  - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"

    post:
      tags:
        - admin
      summary: Add movies to an existing schedule
      description: Appends movie IDs to the schedule for the given date (duplicates are ignored).
      parameters:
        - $ref: "#/components/parameters/Date"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMovies"
            example:
              movies:
                - "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Movies added successfully, returns the updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                date: "20151130"
                movies:
                  - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                  - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                  - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
                  - "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"

    put:
      tags:
        - admin
      summary: Update movies for a schedule
      description: Replaces the movie list for the given date with the provided list.
      parameters:
        - $ref: "#/components/parameters/Date"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMovies"
            example:
              movies:
                - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                - "96798c08-d19b-4986-a05d-7da856efb697"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Schedule updated successfully, returns the updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                date: "20151130"
                movies:
                  - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                  - "96798c08-d19b-4986-a05d-7da856efb697"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"

    delete:
      tags:
        - admin
      summary: Delete a schedule
      description: Deletes the schedule for the specified date, returns the deleted schedule.
      parameters:
        - $ref: "#/components/parameters/Date"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Schedule deleted, returns the deleted schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                date: "20151130"
                movies:
                  - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                  - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                  - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"

  /times/{date}/movies:
    get:
      tags:
        - dev
      summary: Retrieve the program of a date with movie details
      description: Calls Movie for the movie details.
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Detailed schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedSchedule"
              example:
                date: "20151130"
                movies:
                  - id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                    title: "The Good Dinosaur"
                    rating: 7.4
                    director: "Peter Sohn"
                  - id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                    title: "The Martian"
                    rating: 8.2
                    director: "Ridley Scott"
                  - id: "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
                    title: "Spectre"
                    rating: 7.1
                    director: "Sam Mendes"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "503":
          description: The Movie service is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "movie service unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Date:
      name: date
      in: path
      required: true
      description: Date of the schedule in YYYYMMDD format
      schema:
        type: string
      example: "20151130"

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: User is not an admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'movies' must be a list of strings"
    ScheduleNotFound:
      description: Schedule not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "time not found"
    ScheduleConflict:
      description: Schedule conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "schedule already exists"

  schemas:
    Schedule:
      type: object
      description: Representation of a schedule for a specific date.
      properties:
        date:
          type: string
          description: Date of the schedule in YYYYMMDD format
          example: "20151130"
        movies:
          type: array
          description: List of movie UUIDs scheduled for this date
          items:
            type: string
            format: uuid
            description: Unique identifier of a movie
            example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
          example:
            - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
            - "a8034f44-aee4-44cf-b32c-74cf452aaaae"
            - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
      required:
        - date
        - movies

    ScheduleInput:
      type: object
      description: Data needed to create a new schedule.
      properties:
        date:
          type: string
          description: Date of the schedule in YYYYMMDD format
          example: "20151206"
        movies:
          type: array
          description: List of movie UUIDs scheduled for this date
          items:
            type: string
            format: uuid
            description: Unique identifier of a movie
            example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
          example:
            - "720d006c-3a57-4b6a-b18f-9b713b073f3c"
            - "39ab85e5-5e8e-4dc5-afea-65dc368bd7ab"
      required:
        - date
        - movies

    ScheduleMovies:
      type: object
      description: List of movie IDs to update or append to a schedule.
      properties:
        movies:
          type: array
          description: List of movie UUIDs
          items:
            type: string
            format: uuid
            description: Unique identifier of a movie
            example: "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
          example:
            - "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
            - "7daf7208-be4d-4944-a3ae-c1c2f516f3e6"
      required:
        - movies

    Movie:
      type: object
      description: Movie details, as returned by the Movie service.
      properties:
        id:
          type: string
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          nullable: true
          example: "The Good Dinosaur"
        rating:
          type: number
          example: 7.4
        director:
          type: string
          example: "Peter Sohn"

    DetailedSchedule:
      type: object
      description: Schedule of a date with full movie details.
      properties:
        date:
          type: string
          example: "20151130"
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"

    MovieDates:
      type: object
      description: Screening dates of a movie.
      properties:
        movieid:
          type: string
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        dates:
          type: array
          items:
            type: string
          example: ["20151130", "20151201"]

    Error:
      type: object
      properties:
        error:
          type: string
          example: "time not found"
